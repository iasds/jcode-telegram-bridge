[Unit]
Description=jcode Telegram bridge (official TS SDK)
After=jcode-api-bridge.service
Wants=jcode-api-bridge.service

[Service]
StartLimitIntervalSec=120
WorkingDirectory=/root/jcode-telegram-bridge
ExecStart=/usr/bin/node dist/bridge.js
Restart=always
RestartSec=4
Environment=JCODE_HOME=/root/.jcode
Environment=JCODE_RUNTIME_DIR=/run/user/0
Environment=PATH=/root/.local/bin:/usr/bin:/bin

[Install]
WantedBy=multi-user.target
